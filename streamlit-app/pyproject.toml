[project]
name = "evcharge-streamlit"
version = "0.1.0"
description = "Streamlit frontend for EV Charging Demand Forecasting with Dynamic Slot Booking and Demand-Based Pricing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "requests>=2.32",
    "tzdata>=2024.1",   # IANA time zones for zoneinfo on Windows
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
