# EV Charging backend configuration.
# No secrets here: every database value comes from an environment variable.
# DB_PASSWORD has no default on purpose, so the app fails fast instead of connecting with a guess.
# Supply it with scripts/with-db-env.ps1 (reads ../mysql.env) - see backend/README.md.

spring:
  application:
    name: evcharge-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:ev_charging_db}?connectTimeout=10000&socketTimeout=60000&connectionTimeZone=UTC
    username: ${DB_USERNAME:evcharge_app}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: evcharge-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000     # ms to wait for a pooled connection
      validation-timeout: 5000      # ms for a connection liveness check
      max-lifetime: 1800000         # 30 min, well below MySQL's 8 h wait_timeout

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # Hibernate never creates, alters or drops tables; Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true            # flyway clean can never wipe the database
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}   # localhost only by default; set SERVER_ADDRESS to expose deliberately
  port: ${SERVER_PORT:8080}

evcharge:
  booking:                          # a booking is one one-hour slot (the LSTM's validated horizon)
    max-days-ahead: 14              # how far in advance a slot can be booked
    currency: INR
  # Demand-based pricing POLICY (operator rules, not learned by the LSTM):
  # band = highest threshold the forecast utilization reaches (lower bounds are inclusive).
  pricing:
    thresholds:
      medium: 0.40
      high: 0.70
      very-high: 0.90
    multipliers:
      low: 0.90                     # off-peak discount
      medium: 1.15
      high: 1.35
      very-high: 1.60
  # The LSTM only has ACN-Data history (Caltech, Nov 2018 - Feb 2020), so booking prices use its
  # HISTORICAL REPLAY forecast for the same weekday and hour of this test-period week (Mon..Sun).
  forecast:
    replay-week-start: 2020-02-03   # a Monday inside the model's test period
    replay-zone: America/Los_Angeles
  ml-service:
    base-url: ${ML_SERVICE_URL:http://127.0.0.1:8000}
    connect-timeout: 2s
    read-timeout: 5s
